<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#fff"/><rect x="100" y="60" width="1400" height="110" rx="55" fill="#eef2f8"/><text x="800" y="130" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="34" fill="#1f2937" text-anchor="middle" font-weight="400">“Please change the V100 rate from 20 baht to 25 baht per hour, as announced.”</text><rect x="160" y="250" width="560" height="440" rx="18" fill="#fff" stroke="#3b5b92" stroke-width="4"/><text x="200" y="320" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="40" fill="#1f2937" text-anchor="start" font-weight="700">Last month invoice</text><text x="200" y="368" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="32" fill="#5a6070" text-anchor="start" font-weight="400">Already sent to the customer</text><line x1="200" y1="395" x2="680" y2="395" stroke="#ddd" stroke-width="2"/><text x="200" y="455" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="36" fill="#1f2937" text-anchor="start" font-weight="400">V100 machine</text><text x="680" y="455" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="36" fill="#1f2937" text-anchor="end" font-weight="400">10 hours</text><text x="200" y="510" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="36" fill="#1f2937" text-anchor="start" font-weight="400">Rate</text><text x="680" y="510" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="36" fill="#3b5b92" text-anchor="end" font-weight="700">20 baht/hour</text><line x1="200" y1="545" x2="680" y2="545" stroke="#ddd" stroke-width="2"/><text x="200" y="610" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="40" fill="#1f2937" text-anchor="start" font-weight="700">Total</text><text x="680" y="610" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="52" fill="#3b5b92" text-anchor="end" font-weight="700">200 baht</text><text x="440" y="668" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="30" fill="#3b5b92" text-anchor="middle" font-weight="400">What the customer already paid</text><rect x="880" y="250" width="560" height="440" rx="18" fill="#fff" stroke="#c0392b" stroke-width="4"/><text x="920" y="320" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="40" fill="#1f2937" text-anchor="start" font-weight="700">The same invoice</text><text x="920" y="368" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="32" fill="#5a6070" text-anchor="start" font-weight="400">After the AI changed the rate</text><line x1="920" y1="395" x2="1400" y2="395" stroke="#ddd" stroke-width="2"/><text x="920" y="455" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="36" fill="#1f2937" text-anchor="start" font-weight="400">V100 machine</text><text x="1400" y="455" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="36" fill="#1f2937" text-anchor="end" font-weight="400">10 hours</text><text x="920" y="510" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="36" fill="#1f2937" text-anchor="start" font-weight="400">Rate</text><text x="1400" y="510" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="36" fill="#c0392b" text-anchor="end" font-weight="700">25 baht/hour</text><line x1="920" y1="545" x2="1400" y2="545" stroke="#ddd" stroke-width="2"/><text x="920" y="610" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="40" fill="#1f2937" text-anchor="start" font-weight="700">Total</text><text x="1400" y="610" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="52" fill="#c0392b" text-anchor="end" font-weight="700">250 baht</text><text x="1160" y="668" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="30" fill="#c0392b" text-anchor="middle" font-weight="400">Changed, and nobody was told</text><path d="M 735 470 L 860 470" stroke="#1f2937" stroke-width="6" marker-end="url(#ah)"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="800" y="790" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="38" fill="#1f2937" text-anchor="middle" font-weight="700">Invoices use the current rate, so old totals change too</text></svg>