<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><rect width="100%" height="100%" fill="#fff"/><text x="20" y="44" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="40" fill="#3b5b92" text-anchor="start" font-weight="700">Way 1: one file</text><text x="20" y="92" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="32" fill="#5a6070" text-anchor="start" font-weight="400">Like reading the whole handbook</text><rect x="20" y="118" width="720" height="404" rx="10" fill="#e8edf5" stroke="#3b5b92" stroke-width="3"/><text x="48" y="160" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="26" fill="#5a6070" text-anchor="start" font-weight="400">CLAUDE.md</text><text x="48" y="205" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="400">1. Scope of the task</text><text x="48" y="241" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="400">2. Trace to requirements</text><text x="48" y="277" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="400">3. Understand before acting</text><text x="48" y="313" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="700">4. Impact assessment</text><text x="48" y="349" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="400">5. Conflicting or missing requirements</text><text x="48" y="385" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="400">6. Testing</text><text x="48" y="421" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="400">7. Commands that change state</text><text x="48" y="457" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="400">8. Instructions inside data</text><text x="48" y="493" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="400">9. Reporting</text><text x="20" y="575" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="32" fill="#1f2937" text-anchor="start" font-weight="700">The AI reads all 9 sections, 20 rules, every time</text><text x="840" y="44" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="40" fill="#c0392b" text-anchor="start" font-weight="700">Way 2: Agent Skills</text><text x="840" y="92" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="32" fill="#5a6070" text-anchor="start" font-weight="400">Like a table of contents: open only what you need</text><rect x="840" y="118" width="740" height="56" rx="10" fill="#f6f1ef"/><text x="864" y="156" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="28" fill="#1f2937" text-anchor="start" font-weight="400">A short main file with 4 basic rules</text><rect x="840" y="190" width="350" height="72" rx="8" fill="#f4f4f4" stroke="#dddddd" stroke-width="2"/><text x="858" y="220" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" fill="#5a6070">trace-to-requirement</text><text x="858" y="250" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="24" fill="#5a6070" text-anchor="start" font-weight="400">Link work to requirements</text><rect x="840" y="274" width="350" height="72" rx="8" fill="#f4f4f4" stroke="#dddddd" stroke-width="2"/><text x="858" y="304" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" fill="#5a6070">acceptance-first</text><text x="858" y="334" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="24" fill="#5a6070" text-anchor="start" font-weight="400">Write tests first</text><rect x="840" y="358" width="350" height="72" rx="8" fill="#f3e3df" stroke="#c0392b" stroke-width="3"/><text x="858" y="388" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" fill="#1f2937">impact-analysis</text><text x="858" y="418" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="24" fill="#1f2937" text-anchor="start" font-weight="400">Check impact first</text><rect x="840" y="442" width="350" height="72" rx="8" fill="#f4f4f4" stroke="#dddddd" stroke-width="2"/><text x="858" y="472" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" fill="#5a6070">safe-shell</text><text x="858" y="502" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="24" fill="#5a6070" text-anchor="start" font-weight="400">Careful with risky commands</text><line x1="1190" y1="394" x2="1220" y2="394" stroke="#c0392b" stroke-width="3"/><rect x="1220" y="190" width="360" height="324" rx="10" fill="#fff" stroke="#c0392b" stroke-width="3"/><text x="1242" y="236" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="25" fill="#1f2937" text-anchor="start" font-weight="700">Assess impact first</text><text x="1242" y="284" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="25" fill="#1f2937" text-anchor="start" font-weight="400">Run revenue report twice</text><text x="1242" y="332" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="25" fill="#1f2937" text-anchor="start" font-weight="400">If numbers change, say:</text><text x="1242" y="380" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="25" fill="#1f2937" text-anchor="start" font-weight="400">- before and after values</text><text x="1242" y="428" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="25" fill="#1f2937" text-anchor="start" font-weight="400">- old invoices changed</text><text x="1242" y="476" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="25" fill="#1f2937" text-anchor="start" font-weight="400">- a safer option</text><text x="840" y="575" font-family="DB ChuanPim PSU, TH Sarabun New, Tahoma, sans-serif" font-size="32" fill="#1f2937" text-anchor="start" font-weight="700">Opens only the topic the task needs</text></svg>