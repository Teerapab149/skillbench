<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link rel="stylesheet" href="_fig.css">
<style>
  body { width: 1320px; padding: 10px; }
  .strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .stat { border: 1.5px solid var(--line); border-radius: 12px; padding: 16px 18px; text-align: center; }
  .stat .v { font-size: 38px; font-weight: 700; color: var(--amber);
             font-family: 'Cascadia Mono', Consolas, monospace; line-height: 1; }
  .stat .k { font-size: 15px; color: var(--mut); margin-top: 8px; line-height: 1.3; }
</style></head><body>

<div class="strip">
  <div class="stat"><div class="v">396</div><div class="k">run ที่วิเคราะห์</div></div>
  <div class="stat"><div class="v">16.2</div><div class="k">ชั่วโมงที่ agent ทำงาน</div></div>
  <div class="stat"><div class="v">9,261</div><div class="k">ครั้งที่เรียกใช้เครื่องมือ</div></div>
  <div class="stat"><div class="v">1,003</div><div class="k">ไฟล์ที่ถูกแก้</div></div>
  <div class="stat"><div class="v">372M</div><div class="k">token ที่อ่านเข้าไป</div></div>
  <div class="stat"><div class="v">$287</div><div class="k">ค่าใช้จ่าย</div></div>
</div>

</body></html>
